title: Tumlo
spotifast_version: "0.17.1"
description: A fast, lightweight music player for Spotify and Jellyfin on Linux, macOS, and Windows.
lang: en-US
timezone: Europe/Berlin
url: https://spotifast.rocks
baseurl: ""
logo: /assets/images/logo.svg
image: /screenshot.png

markdown: kramdown
kramdown:
  input: GFM

permalink: pretty
theme: jekyll-vitepress-theme

collections:
  guide:
    output: true
    permalink: "/:name/"
  reference:
    output: true
    permalink: "/:name/"

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /screenshot.png
      topics:
        - Spotify and Jellyfin music player
        - Rust
        - egui
        - fastframe
        - librespot
        - Spotify Connect
        - Jellyfin
        - Linux music player
  - scope:
      type: guide
    values:
      layout: default
  - scope:
      type: reference
    values:
      layout: default

jekyll_vitepress:
  seo:
    page_type: TechArticle
    image:
      path: /screenshot.png
      alt: Tumlo showing a playlist with the queue open and a track playing
    publisher:
      type: Organization
      name: Tumlo contributors
      same_as:
        - https://github.com/elav000/spotifast
        - https://github.com/crmne/spotifast
  llms:
    title: Tumlo
    description: >-
      Documentation for Tumlo, a native music player for Spotify and Jellyfin
      on Linux, macOS, and Windows.
    full: true
    details: >-
      Covers installation, sign-in, everyday use, settings, and both providers.
      Source is on
      [GitHub](https://github.com/crmne/spotifast).
  branding:
    site_title: Tumlo
    logo:
      default: /assets/images/logo.svg
      alt: Tumlo
  syntax:
    light_theme: github
    dark_theme: github.dark
  footer:
    enabled: true
    show_on_docs: false
    message: >-
      Tumlo is an independent fork of Spotifast, maintained by its contributors.
    copyright: >-
      <span class="footer-built-with">Copyright and license notices are included in the source and releases. Docs built with <a href="https://jekyll-vitepress.dev" target="_blank" rel="noreferrer">Jekyll VitePress</a>. Tumlo is not affiliated with or endorsed by Spotify AB. Spotify is a trademark of Spotify AB.</span>
  doc_footer:
    enabled: true
    previous_label: Previous page
    next_label: Next page
  last_updated:
    enabled: true
    text: Last updated
    format: "%Y-%m-%d %H:%M"
  edit_link:
    enabled: true
    pattern: "https://github.com/crmne/spotifast/edit/main/docs/:path"
    text: Edit this page on GitHub
  github_star:
    enabled: true
    repository: crmne/spotifast
    text: Star
    show_count: true
  github_sponsor:
    enabled: true
    user: crmne
    text: Sponsor

plugins:
  - jekyll-redirect-from
  - jekyll-vitepress-theme

exclude:
  - _site
  - .jekyll-cache
  - .sass-cache
  - .bundle
  - vendor
  - Gemfile
  - Gemfile.lock
